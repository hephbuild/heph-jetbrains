name: CI

# Tests and builds on pushes to main and on pull requests. The plugin is built
# as a nightly, versioned by .github/workflows/version.sh
# (<pluginVersion>-snapshot.<timestamp>). All Gradle commands run inside the
# devenv shell, matching heph-vscode.
#
# Publishing to the Marketplace `Nightly` channel is off until the repository
# variable PUBLISH_NIGHTLY is set to "true" and the secret
# JETBRAINS_MARKETPLACE_TOKEN exists. Only pushes to main publish.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs; runs on main finish so a publish is
# never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: fallback = true
      - name: Install devenv.sh
        run: nix profile add "github:cachix/devenv-nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev devenv.lock)#devenv"

      - name: Compute version
        id: ver
        run: |
          VERSION=$(.github/workflows/version.sh nightly)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice title=Nightly version::$VERSION"

      - name: Test
        shell: devenv shell bash -- -e {0}
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/test/*.xml
          # Runs on any earlier failure too, where no tests ran and nothing exists.
          if-no-files-found: ignore

      - name: Build plugin
        shell: devenv shell bash -- -e {0}
        run: ./gradlew buildPlugin -PpluginVersion="${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: heph-plugin-${{ steps.ver.outputs.version }}
          path: build/distributions/*.zip

      - name: Publish to Nightly channel
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_NIGHTLY == 'true'
        shell: devenv shell bash -- -e {0}
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin -PpluginVersion="${{ steps.ver.outputs.version }}" -PpublishChannel=Nightly
