name: CI

# Builds and tests on pushes to main and on pull requests. All build commands
# run inside the devenv shell, matching heph-vscode.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: fallback = true
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Cache Gradle and IDE downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .intellijPlatform
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Test
        shell: devenv shell bash -- -e {0}
        run: ./gradlew test

      - name: Build plugin
        shell: devenv shell bash -- -e {0}
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: heph-plugin
          path: build/distributions/*.zip
